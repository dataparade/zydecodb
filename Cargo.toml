[workspace]
members = [
    "crates/zydecodb-engine",
    "crates/zydecodb-document",
    "crates/zydecodb",
    "crates/zydecodb-migrate",
    "fuzz",
]
resolver = "2"

[workspace.package]
version = "1.0.0-rc.1"
edition = "2021"
rust-version = "1.91"
license-file = "../../LICENSE"

[workspace.dependencies]
bytes = "1"
crossbeam = "0.8"
crc32fast = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
# Text exposition only — disable default `protobuf` feature (RUSTSEC-2024-0437).
prometheus = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha2 = "0.11.0"
proptest = "1"
tempfile = "3"
fail = "0.5"
clap = { version = "4", features = ["derive"] }
toml = "1.1"

[workspace.lints.clippy]
# Style debt accumulated before `-D warnings` was enforced. Raising argument
# counts or adding type aliases would churn public store/catalog APIs for no
# runtime gain. New correctness lints still fail CI.
too_many_arguments = "allow"
field_reassign_with_default = "allow"
type_complexity = "allow"
len_without_is_empty = "allow"
wrong_self_convention = "allow"
result_unit_err = "allow"
needless_range_loop = "allow"
match_like_matches_macro = "allow"
while_let_loop = "allow"
redundant_closure = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Controlled-crash poison policy: a panic while holding the engine `Mutex` would
# otherwise poison it, making every later `lock().unwrap()` panic in turn — a
# cascade that limps along on half-mutated in-memory state (the worst outcome
# for a database). Aborting turns any panic into a clean process exit so a
# supervisor restarts the node and WAL replay restores a consistent state.
# (Cargo always builds test/bench harnesses with unwind, so this does not affect
# `cargo test`.)
panic = "abort"

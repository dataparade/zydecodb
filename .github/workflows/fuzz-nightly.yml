# Longer fuzz budgets with corpus cache. PR gate stays in ci.yml fuzz-smoke.
name: Fuzz nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  fuzz-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Restore fuzz corpus
        uses: actions/cache@v6
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.sha }}
          restore-keys: |
            fuzz-corpus-
      - name: Fuzz all targets
        working-directory: fuzz
        env:
          # rust-toolchain.toml pins 1.91; cargo-fuzz needs nightly for -Z
          # sanitizer flags. Without this override every run since 2026-08-07
          # died in the first target's build with "the option `Z` is only
          # accepted on the nightly compiler" and fuzzed nothing.
          RUSTUP_TOOLCHAIN: nightly
        run: |
          set -euo pipefail
          targets=(
            decode_envelope
            fuzz_dispatch
            wal_parser
            sstable_reader
            manifest_parser
            ipc_envelope
            fuzz_filter
            fuzz_update
            fuzz_aggregate
            fuzz_index_key
            zdoc_valueview
          )
          # Multi-hour total budget: 11 targets x 900s ~= 2.75h. The corpus
          # cache makes each night start smarter than the last.
          failed=()
          for t in "${targets[@]}"; do
            echo "==> fuzz $t"
            mkdir -p "corpus/$t"
            # Workspace release LTO + ASAN/sancov + rust-lld drops __sancov_gen_
            # symbols (cargo-fuzz#384/#404), same as the fuzz-smoke gate.
            # -timeout=10: one hung input must not burn 1800s and skip the rest.
            if ! cargo +nightly fuzz run "$t" --sanitizer none -- \
              -max_total_time=900 -timeout=10 -artifact_prefix="artifacts/${t}-"; then
              echo "==> fuzz $t FAILED"
              failed+=("$t")
            fi
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "failed targets: ${failed[*]}"
            exit 1
          fi
      - name: Save fuzz corpus
        if: always()
        uses: actions/cache/save@v6
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.sha }}
      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz/artifacts
          if-no-files-found: ignore
